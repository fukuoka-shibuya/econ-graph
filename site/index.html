<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本の経済グラフ</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface-1:#fcfcfb; --surface-2:#f0efec; --border:#e3e1db; --grid:#ecebe5;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#83817a;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --up:#1baf7a; --down:#e34948;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#111110; --surface-1:#1a1a19; --surface-2:#232321; --border:#333330; --grid:#2b2b28;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8d8b80;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --up:#199e70; --down:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface-1:#1a1a19; --surface-2:#232321; --border:#333330; --grid:#2b2b28;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8d8b80;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --up:#199e70; --down:#e66767;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text-primary);
  font-family:"Yu Gothic UI","Meiryo","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:26px 20px 70px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:25px;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--text-secondary);font-size:12.5px;margin:0}
.btn{font:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--border);
  background:var(--surface-1);color:var(--text-secondary);border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--text-primary);border-color:var(--text-muted)}
.btn.on{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
nav .btn{font-size:13px;padding:7px 14px}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.controls .label{font-size:12.5px;color:var(--text-muted);margin-right:2px}
.lead{color:var(--text-secondary);font-size:13px;margin:0 0 16px;max-width:760px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:11px;margin-bottom:20px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
.kpi .k-name{font-size:12.5px;color:var(--text-secondary);display:flex;align-items:center;gap:7px}
.kpi .dot{width:9px;height:9px;border-radius:50%;flex:none}
.kpi .k-val{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:12.5px;font-weight:400;color:var(--text-secondary);margin-left:3px}
.kpi .k-sub{font-size:12px;color:var(--text-muted);margin-top:1px;font-variant-numeric:tabular-nums}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:17px 17px 12px;margin-bottom:16px}
.card h2{font-size:15.5px;margin:0 0 3px}
.card .note{font-size:12.5px;color:var(--text-secondary);margin:0 0 8px}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin:2px 0 6px}
.legend button{display:flex;align-items:center;gap:7px;background:none;border:0;padding:2px 0;
  cursor:pointer;color:var(--text-secondary);font:inherit;font-size:12.5px}
.legend button.off{opacity:.32}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .09s;left:0;top:0;
  background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:9px 11px;
  box-shadow:0 8px 26px rgba(0,0,0,.16);font-size:12.5px;min-width:150px;z-index:5}
.tip .t-date{color:var(--text-secondary);margin-bottom:5px;font-size:12px}
.tip .t-row{display:flex;align-items:center;gap:12px;justify-content:space-between;white-space:nowrap}
.tip .t-l{display:flex;align-items:center;gap:7px;color:var(--text-secondary)}
.tip .t-v{font-variant-numeric:tabular-nums;color:var(--text-primary);font-weight:600}
.tip .sw{width:9px;height:9px;border-radius:2px;flex:none}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{color:var(--text-secondary);font-weight:500;position:sticky;top:0;background:var(--surface-1);z-index:1}
th:first-child,td:first-child{text-align:left}
.tablebox{max-height:400px;overflow:auto;border:1px solid var(--border);border-radius:10px}
.hide{display:none}
footer{color:var(--text-muted);font-size:12px;margin-top:28px;padding-top:18px;border-top:1px solid var(--border);line-height:1.95}
footer b{color:var(--text-secondary);font-weight:600}
footer a{color:var(--text-secondary)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>日本の経済グラフ</h1>
    <p class="sub" id="sub"></p>
  </div>
  <button class="btn" id="theme">画面を暗くする</button>
</header>

<nav id="nav"></nav>

<div class="controls">
  <span class="label">表示する期間</span>
  <button class="btn" data-yr="3">3年</button>
  <button class="btn on" data-yr="5">5年</button>
  <button class="btn" data-yr="10">10年</button>
  <button class="btn" data-yr="20">20年</button>
  <button class="btn" data-yr="0">全期間</button>
</div>

<div id="panels"></div>

<footer>
  <b>出典</b>　日本銀行「時系列統計データ検索サイト」（マネーストック、マネタリーベース、企業物価指数、金利、為替、貸出・預金、国際収支）／
  総務省統計局「消費者物価指数」<br>
  <b>データ取得日</b>　<span id="fetched"></span>　このファイルは取得した時点の数値を保存したものです。インターネットに繋がっていなくても開けます。<br>
  <b>各統計の最新月</b>　<span id="srclist"></span>
</footer>
</div>

/* ================= チャート ================= */
function drawChart(st){
  const host = st.el, opts = st.opts;
  const series = opts.series.filter(s=>!st.off.has(s.key));
  const rows = st.rows;
  const W = Math.max(320, host.clientWidth||600), H = opts.height||300;
  const m = {t:12, r:opts.stacked?14:Math.min(168,Math.max(92,W*0.17)), b:26, l:opts.left||56};
  const iw = Math.max(60, W-m.l-m.r), ih = H-m.t-m.b;
  const cs = getComputedStyle(document.documentElement);
  const C = k=>cs.getPropertyValue(k).trim();
  const grid=C('--grid'), tmut=C('--text-muted'), tpri=C('--text-primary'), surf=C('--surface-1');
  const val = (r,k)=>{ const v=r[k]; return v==null?null:opts.conv(v); };

  let lo=Infinity, hi=-Infinity;
  if(opts.stacked){
    rows.forEach(r=>{ let s=0; series.forEach(se=>{ s+=(val(r,se.key)||0); }); lo=Math.min(lo,0); hi=Math.max(hi,s); });
  }else{
    rows.forEach(r=>series.forEach(se=>{ const v=val(r,se.key); if(v==null)return; lo=Math.min(lo,v); hi=Math.max(hi,v); }));
  }
  if(!isFinite(lo)){ lo=0; hi=1; }
  if(opts.zero){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  if(hi===lo){ hi=lo+1; }
  const pad=(hi-lo)*0.08; hi+=pad; lo-=pad;
  if(opts.stacked) lo=0;
  const step=niceStep((hi-lo)/5);
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const dec = step<0.1?2:(step<1?1:0);

  const X = i => m.l + (rows.length<2? iw/2 : iw*i/(rows.length-1));
  const Y = v => m.t + ih - (v-lo)/(hi-lo)*ih;

  let s='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" preserveAspectRatio="none" role="img" aria-label="'+opts.title+'">';
  for(let v=lo; v<=hi+step*1e-6; v+=step){
    const y=Y(v), z=Math.abs(v)<step*1e-6 && opts.zero;
    s+='<line x1="'+m.l+'" x2="'+(m.l+iw)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+(z?tmut:grid)+'" stroke-width="1"/>';
    s+='<text x="'+(m.l-9)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="'+tmut+'">'+fmt(v,dec)+'</text>';
  }
  const yrs=[]; rows.forEach((r,i)=>{ const y=r.date.slice(0,4); if(!yrs.length||yrs[yrs.length-1].y!==y) yrs.push({y,i}); });
  const skip=Math.ceil(yrs.length/Math.max(3,Math.floor(iw/70)));
  yrs.forEach((o,k)=>{ if(k%skip) return;
    s+='<text x="'+X(o.i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="'+tmut+'">'+o.y+'</text>'; });

  if(opts.stacked){
    const cum = rows.map(()=>0);
    const bands = series.map(se=>{
      const top = rows.map((r,i)=> cum[i] += (val(r,se.key)||0));
      return {se, top: top.slice(), base: top.map((t,i)=> t-(val(rows[i],se.key)||0))};
    });
    bands.slice().reverse().forEach(b=>{
      let d='M'+X(0).toFixed(1)+' '+Y(b.top[0]).toFixed(1);
      b.top.forEach((v,i)=> d+='L'+X(i).toFixed(1)+' '+Y(v).toFixed(1));
      for(let i=b.base.length-1;i>=0;i--) d+='L'+X(i).toFixed(1)+' '+Y(b.base[i]).toFixed(1);
      s+='<path d="'+d+'Z" style="fill:var(--series-'+b.se.n+')" fill-opacity="0.92"/>';
      let ld='M'+X(0).toFixed(1)+' '+Y(b.top[0]).toFixed(1);
      b.top.forEach((v,i)=> ld+='L'+X(i).toFixed(1)+' '+Y(v).toFixed(1));
      s+='<path d="'+ld+'" fill="none" stroke="'+surf+'" stroke-width="2"/>';
    });
  }else{
    series.forEach(se=>{
      let d='', pen=false;
      rows.forEach((r,i)=>{ const v=val(r,se.key);
        if(v==null){ pen=false; return; }
        d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); pen=true; });
      if(d) s+='<path d="'+d+'" fill="none" style="stroke:var(--series-'+se.n+')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    const ends = series.map(se=>{
      for(let i=rows.length-1;i>=0;i--){ const v=val(rows[i],se.key); if(v!=null) return {se, y:Y(v)}; }
      return null;
    }).filter(Boolean).sort((a,b)=>a.y-b.y);
    for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<15) ends[i].y=ends[i-1].y+15;
    ends.forEach(e=>{
      s+='<circle cx="'+(m.l+iw+9)+'" cy="'+e.y.toFixed(1)+'" r="4" style="fill:var(--series-'+e.se.n+')"/>';
      s+='<text x="'+(m.l+iw+18)+'" y="'+(e.y+4).toFixed(1)+'" font-size="11.5" fill="'+tpri+'">'+(e.se.short||e.se.name)+'</text>';
    });
  }
  s+='<g class="hov"></g><rect x="'+m.l+'" y="'+m.t+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg>';

  st.box.innerHTML = s;
  const svg = st.box.querySelector('svg'), hov = svg.querySelector('.hov');
  const dec2 = opts.dec==null?1:opts.dec;

  svg.addEventListener('mousemove', ev=>{
    const b=svg.getBoundingClientRect();
    const px=(ev.clientX-b.left)*(W/b.width);
    let i = rows.length<2?0:Math.round((px-m.l)/iw*(rows.length-1));
    i=Math.max(0,Math.min(rows.length-1,i));
    const r=rows[i], x=X(i);
    let h='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+m.t+'" y2="'+(m.t+ih)+'" stroke="'+tmut+'" stroke-width="1" opacity=".5"/>';
    let html='', cum=0;
    series.forEach(se=>{
      const v=val(r,se.key);
      if(v!=null){
        const cy = opts.stacked? Y(cum+=v) : Y(v);
        h+='<circle cx="'+x.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.5" style="fill:var(--series-'+se.n+')" stroke="'+surf+'" stroke-width="2"/>';
      }
      html+='<div class="t-row"><span class="t-l"><span class="sw" style="background:var(--series-'+se.n+')"></span>'+se.name+
            '</span><span class="t-v">'+fmt(v,dec2)+opts.unit+'</span></div>';
    });
    hov.innerHTML=h;
    const tip=st.tip;
    tip.innerHTML='<div class="t-date">'+jdate(r.date)+'</div>'+html;
    tip.style.opacity=1;
    const hb=host.getBoundingClientRect();
    let L=ev.clientX-hb.left+16;
    if(L+tip.offsetWidth>hb.width) L=ev.clientX-hb.left-tip.offsetWidth-16;
    tip.style.left=Math.max(0,L)+'px';
    tip.style.top=Math.max(0, ev.clientY-hb.top-tip.offsetHeight/2)+'px';
  });
  svg.addEventListener('mouseleave', ()=>{ hov.innerHTML=''; st.tip.style.opacity=0; });
}

function niceStep(x){
  const e=Math.pow(10,Math.floor(Math.log10(Math.abs(x)||1))), n=x/e;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e;
}

実質"}]},{"title":"銀行の貸出残高　名目と実質","note":"実質は2020年の物価に直した金額（単位：兆円）","unit":"兆円","conv":"cho","filter":"rl_loan","series":[{"key":"bk_loan","name":"名目","short":"名目"},{"key":"rl_loan","name":"実質（2020年の物価）","short":"実質"}]},{"title":"金利　名目と実質","note":"実質金利 ＝ 無担保コール翌日物 − 消費者物価の前年比。マイナスは、お金を借りた方が得になっている状態です（単位：年％）","unit":"年%","dec":2,"zero":true,"left":58,"filter":"rl_rate","series":[{"key":"r_call","name":"名目金利","short":"名目"},{"key":"rl_rate","name":"実質金利","short":"実質"}]},{"title":"為替　名目と実質","note":"主要な通貨全体に対する円の強さ。実質は日本と海外の物価の差も調整した値（2020年＝100、下がるほど円安）","unit":"","filter":"fx_reer","series":[{"key":"fx_neer","name":"名目実効為替レート","short":"名目"},{"key":"fx_reer","name":"実質実効為替レート","short":"実質"}]},{"title":"日銀のお金（マネタリーベース）　名目と実質","note":"実質は2020年の物価に直した金額（単位：兆円）","unit":"兆円","conv":"cho","filter":"rl_mb","series":[{"key":"mb","name":"名目","short":"名目"},{"key":"rl_mb","name":"実質（2020年の物価）","short":"実質"}]}],"tableNote":"金額は兆円（実質は2020年の物価に換算）、金利は年％","table":[{"key":"ms_M3","name":"M3 名目","conv":"cho","dec":0},{"key":"rl_M3","name":"M3 実質","conv":"cho","dec":0},{"key":"bk_loan","name":"貸出 名目","conv":"cho","dec":0},{"key":"rl_loan","name":"貸出 実質","conv":"cho","dec":0},{"key":"r_call","name":"名目金利","dec":3,"unit":"%"},{"key":"rl_rate","name":"実質金利","dec":2,"unit":"%"},{"key":"fx_reer","name":"実質実効為替"}]}];

let years = 5, active = 0;
const CHARTS = [];

const nav = document.getElementById('nav'), panels = document.getElementById('panels');
CONF.forEach((tab,ti)=>{
  const b=document.createElement('button');
  b.className='btn'+(ti===0?' on':''); b.textContent=tab.name;
  b.onclick=()=>{ show(ti); location.hash='t'+ti; };
  nav.appendChild(b);

  const p=document.createElement('div');
  p.className = ti===0?'':'hide';
  let html = '<p class="lead">'+tab.lead+'</p><div class="kpis">';
  (tab.kpis||[]).forEach(k=>{
    const r=latest(k.key);
    const v=r? (k.conv==='cho'? CHO(r[k.key]) : r[k.key]) : null;
    let sub='';
    if(k.sub && r){
      const sv=r[k.sub];
      sub = sv==null?'' : '前年比 <span style="color:var('+(sv>=0?'--up':'--down')+');font-weight:600">'+(sv>0?'+':'')+fmt(sv,1)+'%</span>';
    }
    html += '<div class="kpi"><div class="k-name">'+(k.n?'<span class="dot" style="background:var(--series-'+k.n+')"></span>':'')+k.name+'</div>'+
            '<div class="k-val">'+fmt(v,k.dec==null?1:k.dec)+'<small>'+k.unit+'</small></div>'+
            '<div class="k-sub">'+(r?jdate(r.date):'')+(sub?'　'+sub:'')+'</div></div>';
  });
  html += '</div>';
  tab.charts.forEach((c,ci)=>{
    html += '<div class="card"><h2>'+c.title+'</h2><p class="note">'+c.note+'</p>'+
            '<div class="legend" data-c="'+ti+'-'+ci+'"></div>'+
            '<div class="chart" data-c="'+ti+'-'+ci+'"><div class="box"></div><div class="tip"></div></div></div>';
  });
  if(tab.table){
    html += '<div class="card"><h2>数値の表</h2><p class="note">直近36か月分。'+(tab.tableNote||'')+'</p>'+
            '<div class="tablebox"><table data-t="'+ti+'"></table></div></div>';
  }
  p.innerHTML = html;
  panels.appendChild(p);

  tab.charts.forEach((c,ci)=>{
    c.series.forEach((s,i)=> s.n = i+1);
    const holder = p.querySelector('.chart[data-c="'+ti+'-'+ci+'"]');
    const st = {el:holder, box:holder.querySelector('.box'), tip:holder.querySelector('.tip'),
                opts:Object.assign({conv:ID, unit:'', title:c.title}, c), off:new Set(), rows:[], tab:ti};
    st.opts.conv = c.conv==='cho'? CHO : ID;
    CHARTS.push(st);
    const lg = p.querySelector('.legend[data-c="'+ti+'-'+ci+'"]');
    if(c.series.length>1){
      lg.innerHTML = c.series.map(s=>'<button data-k="'+s.key+'"><span class="sw" style="background:var(--series-'+s.n+')"></span>'+s.name+'</button>').join('');
      lg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
        const k=b.dataset.k;
        if(st.off.has(k)){ st.off.delete(k); b.classList.remove('off'); }
        else if(c.series.length-st.off.size>1){ st.off.add(k); b.classList.add('off'); }
        drawChart(st);
      });
    }else lg.remove();
  });

  if(tab.table){
    const el = p.querySelector('table[data-t="'+ti+'"]');
    const cols = tab.table;
    const src = ROWS.filter(r=>cols.some(c=>r[c.key]!=null)).slice(-36).reverse();
    el.innerHTML = '<thead><tr><th>年月</th>'+cols.map(c=>'<th>'+c.name+'</th>').join('')+'</tr></thead><tbody>'+
      src.map(r=>'<tr><td>'+jdate(r.date)+'</td>'+cols.map(c=>{
        const v = r[c.key]==null? null : (c.conv==='cho'? CHO(r[c.key]) : r[c.key]);
        return '<td>'+fmt(v, c.dec==null?1:c.dec)+(v==null?'':(c.unit||''))+'</td>';
      }).join('')+'</tr>').join('')+'</tbody>';
  }
});

function applyRange(){
  CHARTS.forEach(st=>{
    const key = st.opts.filter || st.opts.series[0].key;
    let rows = ROWS.filter(r=>r[key]!=null);
    if(years) rows = rows.slice(-years*12);
    if(st.opts.stacked) rows = rows.filter(r=>st.opts.series.every(s=>r[s.key]!=null));
    st.rows = rows;
  });
  drawActive();
}
function drawActive(){ syncThemeBtn(); CHARTS.forEach(st=>{ if(st.tab===active && st.rows.length) drawChart(st); }); }
function show(ti){
  active = ti;
  [...nav.children].forEach((x,i)=>x.classList.toggle('on', i===ti));
  [...panels.children].forEach((x,i)=>x.classList.toggle('hide', i!==ti));
  drawActive();
}
addEventListener('hashchange', ()=>{ const m=/^#t(\d+)$/.exec(location.hash); if(m && CONF[+m[1]]) show(+m[1]); });

document.querySelectorAll('[data-yr]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-yr]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); years=+b.dataset.yr; applyRange();
});
addEventListener('resize',()=>{ clearTimeout(window._rt); window._rt=setTimeout(drawActive,140); });

applyRange();
(function(){ const m=/^#t(\d+)$/.exec(location.hash); if(m && CONF[+m[1]]) show(+m[1]); })();
</script>
</body>
</html>
